<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>设计协作 · 导出</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f7f8fa;
    --border: #e3e6ec;
    --text: #1b1d22;
    --dim: #6b7280;
    --accent: #6c4cf1;
    --accent-weak: rgba(108, 76, 241, 0.1);
    --err: #d92d20;
    --ok: #067647;
    --warn: #b54708;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; cursor: pointer; }
  .hidden { display: none !important; }
  .dim { color: var(--dim); }
  .small { font-size: 12px; }

  header.head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  header.head h1 { margin: 0; font-size: 16px; }
  .meta { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .link { border: none; background: transparent; color: var(--dim); padding: 4px; }
  .link:hover { color: var(--text); }

  .error {
    margin: 10px 16px 0; padding: 10px 12px; border: 1px solid rgba(217, 45, 32, 0.35);
    background: rgba(217, 45, 32, 0.06); border-radius: var(--radius); color: var(--err);
    flex: 0 0 auto; white-space: pre-wrap; word-break: break-word;
  }
  .error .row { display: flex; align-items: flex-start; gap: 8px; }
  .error .row > span { flex: 1; }
  .error button { flex: 0 0 auto; }

  /* 首次运行：只显示粘贴令牌 */
  .gate { padding: 28px 16px; flex: 1 1 auto; }
  .gate h2 { margin: 0 0 6px; font-size: 16px; }
  .gate p { margin: 0 0 14px; }
  .gate input {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; color: var(--text); font: inherit; outline: none; margin-bottom: 10px;
  }
  .gate input:focus { border-color: var(--accent); }
  .gate .wide { width: 100%; }
  .gate .server-line { margin-top: 14px; }
  .gate .server-line button { padding: 0 2px; }
  .gate #gateServerRow { margin-top: 8px; }

  main { flex: 1 1 auto; overflow-y: auto; padding: 12px 16px 8px; }

  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 12px; }
  .field .hint { color: var(--dim); font-size: 12px; margin-top: 5px; white-space: pre-wrap; }
  .field .hint.err { color: var(--err); }
  input[type="text"], input[type="password"], select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; color: var(--text); font: inherit; outline: none;
  }
  input[type="text"]:focus, input[type="password"]:focus, select:focus { border-color: var(--accent); }

  /* 顶部目标条 */
  .target { border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); }
  .target-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .target-text { flex: 1; min-width: 0; }
  .target-k { font-size: 11px; color: var(--dim); }
  .target-v { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .target-editor { padding: 12px; border-top: 1px solid var(--border); background: #fff; }

  /* 常用导出选项：常驻显示，紧凑两行 */
  .options {
    margin-top: 10px; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--panel);
  }
  .opt-row { display: flex; align-items: center; gap: 8px; min-height: 30px; }
  .opt-row + .opt-row { margin-top: 6px; }
  .opt-label { flex: 0 0 auto; width: 30px; font-size: 11px; color: var(--dim); }
  .options .segmented { flex: 1; gap: 6px; }
  .options .segmented button { padding: 5px 6px; border-radius: 6px; font-size: 12px; }
  .options .segmented button .s { display: inline; margin-left: 3px; font-size: 10px; }
  .options .radios { flex: 0 0 auto; gap: 4px; }
  .options .radios label { flex: 0 0 auto; padding: 4px 10px; border-radius: 6px; }
  .options .toggle { display: flex; align-items: center; gap: 5px; margin-left: auto; font-size: 12px; white-space: nowrap; }
  #scaleHint { margin-top: 6px; font-size: 11px; color: var(--dim); }

  /* 画板列表：只读镜像 Figma 当前选中项，紧凑可滚动 */
  .boards { margin-top: 12px; }
  .list-tools { margin-bottom: 6px; }
  .list-tools .t { font-size: 12px; color: var(--dim); }
  .board-list { list-style: none; margin: 0; padding: 0; max-height: 172px; overflow-y: auto; }
  .board {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
    margin-bottom: 4px; background: var(--panel);
  }
  .board .name { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-empty {
    padding: 16px 12px; border: 1px dashed var(--border); border-radius: 6px;
    color: var(--dim); font-size: 12px; text-align: center;
  }

  /* 高级设置 */
  .advanced { margin-top: 12px; border: 1px solid var(--border); border-radius: var(--radius); }
  .advanced > summary {
    padding: 9px 12px; font-size: 12px; color: var(--dim); cursor: pointer; user-select: none;
    list-style: none;
  }
  .advanced > summary::-webkit-details-marker { display: none; }
  .advanced > summary::before { content: '▸ '; }
  .advanced[open] > summary::before { content: '▾ '; }
  .advanced[open] > summary { border-bottom: 1px solid var(--border); }
  .adv-body { padding: 12px; }

  .segmented { display: flex; gap: 8px; }
  .segmented button {
    flex: 1; padding: 8px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 12px;
  }
  .segmented button.active { border-color: var(--accent); background: var(--accent-weak); color: var(--accent); font-weight: 600; }
  .segmented button .s { display: block; font-size: 11px; color: var(--dim); margin-top: 2px; }
  .segmented button.active .s { color: var(--accent); }

  .radios { display: flex; gap: 8px; }
  .radios label {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--panel); cursor: pointer; font-size: 12px;
  }
  .radios label.on { border-color: var(--accent); background: var(--accent-weak); color: var(--accent); }

  .switch { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); }
  .switch input { margin-top: 2px; }
  .switch .body { flex: 1; }

  .row { display: flex; gap: 8px; }
  .row > .grow { flex: 1; }
  .btn {
    padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: #fff; color: var(--text); font: inherit;
  }
  .btn:hover { border-color: #c9ced8; }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #5a3ce0; }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .btn.text { border: none; background: transparent; color: var(--accent); padding: 4px; }
  .btn.text:hover { text-decoration: underline; }

  footer.foot {
    display: flex; align-items: center; gap: 8px; padding: 12px 16px;
    border-top: 1px solid var(--border); flex: 0 0 auto;
  }
  footer.foot .grow { flex: 1; }
  footer.foot #upload { min-width: 150px; }

  .progress { margin-top: 12px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); }
  .progress .head-row { display: flex; justify-content: space-between; gap: 8px; }
  .progress .bar { height: 6px; border-radius: 999px; background: #e6e8ee; overflow: hidden; margin: 8px 0; }
  .progress .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s ease; }
  .progress .stage { font-size: 12px; color: var(--dim); }
  .progress .fail {
    margin-top: 10px; padding: 8px 10px; border-radius: 6px; border: 1px solid rgba(217, 45, 32, 0.35);
    background: rgba(217, 45, 32, 0.06); color: var(--err); font-size: 12px;
    display: flex; align-items: flex-start; gap: 8px; white-space: pre-wrap; word-break: break-word;
  }
  .progress .fail span { flex: 1; }

  .success { margin-top: 12px; padding: 14px; border: 1px solid rgba(6, 118, 71, 0.35); background: rgba(6, 118, 71, 0.06); border-radius: var(--radius); }
  .success h3 { margin: 0 0 6px; font-size: 15px; color: var(--ok); }
  .success .num { font-size: 20px; font-weight: 700; }
  .success .warn { margin-top: 10px; font-size: 12px; color: var(--warn); white-space: pre-wrap; }
  .success .open { display: inline-block; margin-top: 12px; padding: 8px 12px; border-radius: 6px; background: var(--ok); color: #fff; text-decoration: none; font-weight: 600; }
  .success .url { font-size: 11px; color: var(--dim); word-break: break-all; margin-top: 6px; }

  pre.json {
    margin: 10px 0 0; padding: 10px; max-height: 220px; overflow: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    font: 11px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; word-break: break-all;
  }
</style>
</head>
<body>
  <header class="head">
    <div>
      <h1>导出到设计协作</h1>
      <div id="meta" class="meta">正在启动…</div>
    </div>
    <button id="close" class="link" type="button">关闭</button>
  </header>

  <div id="error" class="error hidden">
    <div class="row">
      <span id="errorText"></span>
      <button id="errorRetry" class="btn small hidden" type="button">重试</button>
    </div>
  </div>

  <!-- 首次运行：粘贴令牌 -->
  <section id="gate" class="gate hidden">
    <h2>粘贴导入令牌</h2>
    <p class="dim small">在网站「团队设置 → 导入令牌」生成，粘贴到这里保存。</p>
    <input id="gateToken" type="text" placeholder="imp_ 开头" autocomplete="off" spellcheck="false" />
    <button id="gateSave" class="btn primary wide" type="button">保存并继续</button>
    <p class="dim small server-line">
      服务器：<span id="gateServerText">http://localhost:4000</span>
      <button id="gateServerEdit" class="btn text" type="button">更改</button>
    </p>
    <p id="gateStorageHint" class="dim small hidden"></p>
    <div id="gateServerRow" class="hidden">
      <input id="gateBaseUrl" type="text" placeholder="http://localhost:4000" />
    </div>
  </section>

  <!-- 单屏主界面 -->
  <main id="main" class="hidden">
    <section class="target">
      <div class="target-row">
        <div class="target-text">
          <div class="target-k">导出到</div>
          <div id="targetSummary" class="target-v">团队 / 项目 / 编组</div>
        </div>
        <button id="targetEdit" class="btn small" type="button">更改</button>
      </div>

      <div id="targetEditor" class="target-editor hidden">
        <div class="field">
          <label>团队</label>
          <select id="team"></select>
          <div id="teamHint" class="hint"></div>
        </div>
        <div class="field">
          <label>项目</label>
          <select id="project"></select>
          <div id="projectHint" class="hint"></div>
        </div>
        <div class="field">
          <label>编组</label>
          <select id="group"></select>
          <input id="newGroupName" class="hidden" type="text" maxlength="50" placeholder="新编组名称，例如：首页" style="margin-top: 8px;" />
          <div id="groupHint" class="hint">同一画板重复导入时会原位更新，不会产生重复画板。</div>
        </div>
      </div>
    </section>

    <section class="options">
      <div class="opt-row">
        <span class="opt-label">平台</span>
        <div id="platformGroup" class="segmented">
          <button type="button" data-platform="android">Android<span class="s">dp</span></button>
          <button type="button" data-platform="ios">iOS<span class="s">pt</span></button>
          <button type="button" data-platform="web">Web<span class="s">px</span></button>
        </div>
      </div>
      <div class="opt-row">
        <span class="opt-label">倍率</span>
        <div id="scaleGroup" class="radios">
          <label data-scale="1"><input type="radio" name="scale" value="1" /> 1x</label>
          <label data-scale="2"><input type="radio" name="scale" value="2" /> 2x</label>
          <label data-scale="3"><input type="radio" name="scale" value="3" /> 3x</label>
          <label data-scale="4"><input type="radio" name="scale" value="4" /> 4x</label>
        </div>
      </div>
      <div id="scaleHint" class="hint small"></div>
    </section>

    <section class="boards">
      <div class="list-tools">
        <span class="t">当前选中的画板</span>
      </div>
      <ul id="boardList" class="board-list"></ul>
      <div id="boardHint" class="board-empty hidden">请在 Figma 里选中要导出的画板</div>
    </section>

    <details id="advanced" class="advanced">
      <summary>高级设置</summary>
      <div class="adv-body">
        <div class="field">
          <label>服务器地址</label>
          <div class="row">
            <input id="baseUrl" class="grow" type="text" placeholder="http://localhost:4000" />
            <button id="reconnect" class="btn" type="button">重新连接</button>
          </div>
        </div>

        <div class="field">
          <label>导入令牌</label>
          <div class="row">
            <input id="token" class="grow" type="password" placeholder="imp_ 开头" />
            <button id="saveToken" class="btn" type="button">保存令牌</button>
          </div>
        </div>
      </div>
    </details>

    <div id="progressBox" class="progress hidden">
      <div class="head-row">
        <strong id="progressTitle">准备上传…</strong>
        <span id="progressCount" class="dim small"></span>
      </div>
      <div class="bar"><i id="progressBar"></i></div>
      <div id="progressStage" class="stage"></div>
      <div id="progressFail" class="fail hidden">
        <span id="progressFailText"></span>
        <button id="progressRetry" class="btn small" type="button">重试</button>
      </div>
    </div>

    <div id="successBox" class="success hidden">
      <h3>导入完成</h3>
      <div><span id="successFrames" class="num">0</span> 个画板 · <span id="successNodes" class="num">0</span> 个节点</div>
      <div id="successWarn" class="warn hidden"></div>
      <a id="openSite" class="open" href="#" target="_blank" rel="noopener noreferrer">在网站中打开</a>
      <div id="successUrl" class="url"></div>
      <div id="netInfo" class="url"></div>
    </div>

    <div id="jsonBox" class="hidden">
      <pre id="jsonText" class="json"></pre>
      <div class="row" style="margin-top: 8px;">
        <button id="copyJson" class="btn" type="button">复制 JSON</button>
        <button id="downloadJson" class="btn" type="button">下载 JSON</button>
      </div>
    </div>
  </main>

  <footer id="foot" class="foot hidden">
    <button id="jsonOnly" class="btn text" type="button">仅导出 JSON</button>
    <div class="grow"></div>
    <button id="upload" class="btn primary" type="button">导出并上传</button>
  </footer>

<script>
(function () {
  'use strict';

  var MAX_IMAGE_BYTES = 5 * 1024 * 1024;
  // 与 code.js 的 PLUGIN_VERSION 保持一致；不一致说明 Figma 缓存了旧界面
  var UI_VERSION = '1.5.5';
  var UNASSIGNED_TEAM = 'unassigned';
  var state = {
    boards: [],
    platform: 'android',
    scale: 2,
    // v1.5.2：位图切图与逐图层高清切图固定开启，不再提供开关（前端已隐藏）
    includeImage: true,
    includeSlices: true,
    // v1.5.4：上次偏好读取来源（client/doc），门禁页显示「上次登录状态」存在哪
    prefsSrc: null,
    // v1.5.5：存储探针结果（clientOk / clientErr / pluginIdMissing）
    prefsProbe: null,
    baseUrl: 'http://localhost:4000',
    token: '',
    scope: '',
    // 三级目标：团队 → 项目 → 编组
    teams: [],
    teamId: '',
    projects: [],
    projectId: '',
    groups: [],
    groupId: '',
    newGroupName: '',
    targetOpen: false,
    boot: {},
    started: false,
    busy: false,
    // 上传失败后重试时复用已导出的结果，避免重新遍历节点
    exportCache: {},
    // 本次上传里已经成功入库的画板：重试时直接跳过
    uploaded: {},
    boardKey: '',
    progressPct: 0,
    // 黑匣子：区分「主线程卡死」vs「消息丢失」——10 秒一次 ping，主线程立即回 pong
    pingTimer: null,
    lastPongAt: 0,
    mainBusy: false,
    lastPongVersion: '',
    lastPongGen: -1,
    lastProgressMsg: '',
    lastProgressAt: 0,
    // 分片接收统计：区分「分片也丢了」vs「只有 board-exported 丢」
    chunkCount: 0,
    lastChunkAt: 0,
  };

  var pending = new Map();
  // 主线程把切图 base64 分成 256KB 片回传，按 requestId 拼装后再上传
  var imageChunkBufs = new Map();
  var seq = 0;

  function $(id) { return document.getElementById(id); }
  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function postToPlugin(message) {
    parent.postMessage({ pluginMessage: message }, '*');
  }
  // 按阶段给不同「静默上限」：读节点 120 秒 / 单张切图 120 秒 / 单板上传 60 秒。
  // 主线程 exportAsync 是同步阻塞的，这段时间一条消息都发不出来，用一个阈值会误杀。
  // v1.3.9：一次 ask 覆盖整个画板（序列化 + 整板 PNG + 逐图层 4x/SVG 切图），大画板/复杂图层
  // 单个 exportAsync 就可能超过半分钟，30/90 秒的旧阈值实测会误判「无响应」，放宽到 120 秒。
  var STAGE_TIMEOUT_MS = { nodes: 120000, images: 120000, upload: 60000 };
  var HEARTBEAT_TIMEOUT_MS = STAGE_TIMEOUT_MS.nodes;
  function timeoutText(ms) {
    var now = Date.now();
    var idle = state.lastPongAt && (now - state.lastPongAt) < 30000 && !state.mainBusy;
    var headline = idle
      ? '导出结果未回传（主线程空闲且能应答 ping，疑似 Figma 丢弃了插件消息）：'
      : '插件主线程 ' + Math.round(ms / 1000) + ' 秒没有响应（Figma 可能正在处理大画板）：';
    var lines = headline + '请点「重试」，仍不行再关闭插件重新打开';
    // v1.5.1：报错自证版本——UI 与主线程版本不一致 = Figma 缓存了旧插件代码
    lines += '\n版本：UI ' + UI_VERSION +
      (state.lastPongVersion ? ' / 主线程 ' + state.lastPongVersion : ' / 主线程版本未知（从未收到 pong）');
    if (state.lastPongVersion && state.lastPongVersion !== UI_VERSION) {
      lines += '（不一致！Figma 正在跑旧插件：必须完全退出 Figma——托盘图标也退出/任务管理器结束进程——再重开）';
    }
    // 黑匣子：把卡死位置带进错误报告——最后一条进度消息 + 主线程回声状态
    if (state.lastProgressMsg) {
      lines += '\n最后进度消息：' + state.lastProgressMsg + '（' + Math.round((now - state.lastProgressAt) / 1000) + ' 秒前）';
    } else {
      lines += '\n最后进度消息：（本次上传未收到任何进度消息）';
    }
    if (state.lastPongAt) {
      lines += '\n主线程回声：' + Math.round((now - state.lastPongAt) / 1000) + ' 秒前' +
        (state.mainBusy ? '（主线程自报：仍在执行任务）' : '（主线程自报：空闲）') +
        '，代次 ' + state.lastPongGen;
    } else {
      lines += '\n主线程回声：从未收到（主线程从上传开始就没响应过任何 ping）';
    }
    if (state.chunkCount > 0) {
      lines += '\n分片接收：本次共收到 ' + state.chunkCount + ' 片（最后一片 ' +
        Math.round((now - state.lastChunkAt) / 1000) + ' 秒前）';
    } else {
      lines += '\n分片接收：本次未收到任何分片';
    }
    return lines;
  }
  function ask(message, timeoutMs) {
    var requestId = 'r' + (++seq);
    return new Promise(function (resolve, reject) {
      var entry = { resolve: resolve, reject: reject, timer: null };
      entry.silenceMs = timeoutMs || HEARTBEAT_TIMEOUT_MS;
      entry.arm = function (ms) {
        // 心跳只允许延长预算、不允许缩短：一次 ask 覆盖整个画板导出，中途会混用
        // nodes(60s)/images(120s) 两档消息，若小值覆盖大值，紧跟的长 exportAsync 会被误杀
        if (typeof ms === 'number' && ms > 0 && ms > entry.silenceMs) entry.silenceMs = ms;
        clearTimeout(entry.timer);
        entry.timer = setTimeout(function () {
          pending.delete(requestId);
          imageChunkBufs.delete(requestId);
          // 一并清掉该请求名下的分片缓冲（payload / slice:N），避免残留占内存
          imageChunkBufs.forEach(function (_, k) {
            if (k.indexOf(requestId + ':') === 0) imageChunkBufs.delete(k);
          });
          reject(new Error(timeoutText(entry.silenceMs)));
        }, entry.silenceMs);
      };
      entry.arm();
      pending.set(requestId, entry);
      postToPlugin(Object.assign({}, message, { requestId: requestId }));
    });
  }
  function settle(requestId, payload) {
    var p = pending.get(requestId);
    if (!p) return false;
    clearTimeout(p.timer);
    pending.delete(requestId);
    p.resolve(payload);
    return true;
  }
  /** v1.5.0：拼装分片回传的画板 JSON（单条大 postMessage 会被 Figma 静默丢弃）。
   * board-exported 与 json-result 共用；失败时抛错，调用方转成 ok:false 结束请求。 */
  function assemblePayloadChunks(msg) {
    if (msg.payloadError && !msg.payloadChunks) {
      throw new Error('画板数据回传失败：' + msg.payloadError);
    }
    if (!msg.payloadChunks) return;
    var pbuf = imageChunkBufs.get(msg.payloadKey);
    imageChunkBufs.delete(msg.payloadKey);
    if (!pbuf || pbuf.received < pbuf.total) {
      throw new Error('画板数据分片回传不完整（' + (pbuf ? pbuf.received : 0) + '/' +
        (pbuf ? pbuf.total : msg.payloadChunks) + '），请重试');
    }
    try {
      msg.payload = JSON.parse(pbuf.parts.join(''));
    } catch (perr) {
      throw new Error('画板数据拼装失败：' + ((perr && perr.message) || String(perr)));
    }
  }
  /** 收到主线程 progress 心跳：重置该请求的无响应计时（按消息里带的阶段上限） */
  function heartbeat(requestId, silenceMs) {
    var p = pending.get(requestId);
    if (!p || typeof p.arm !== 'function') return false;
    p.arm(silenceMs);
    return true;
  }
  function rejectAll(message) {
    pending.forEach(function (p) {
      clearTimeout(p.timer);
      p.reject(new Error(message));
    });
    pending.clear();
    imageChunkBufs.clear();
  }

  var retryHandler = null;
  function showError(message, retry) {
    $('errorText').textContent = String(message || '未知错误');
    $('error').classList.remove('hidden');
    retryHandler = typeof retry === 'function' ? retry : null;
    $('errorRetry').classList.toggle('hidden', !retryHandler);
  }
  function clearError() {
    $('error').classList.add('hidden');
    $('errorText').textContent = '';
    retryHandler = null;
    $('errorRetry').classList.add('hidden');
  }

  // ---------- 视图切换 ----------
  function showGate(reason) {
    $('gate').classList.remove('hidden');
    $('main').classList.add('hidden');
    $('foot').classList.add('hidden');
    var tokenInput = $('gateToken');
    tokenInput.value = '';
    $('gateServerText').textContent = baseUrl();
    $('gateBaseUrl').value = state.baseUrl;
    // v1.5.5 存储探针：manifest 无固定插件 id 时 Figma 禁用本地存储——这是「每次都要填令牌」的根因
    var probe = state.prefsProbe;
    var src = state.prefsSrc;
    var hint = $('gateStorageHint');
    var lsHasToken = false;
    var lsPrefs = lsLoadPrefs();
    if (lsPrefs && typeof lsPrefs.token === 'string' && /^imp_/.test(lsPrefs.token)) lsHasToken = true;
    if (probe && probe.pluginIdMissing) {
      hint.textContent = '诊断：本插件 manifest.json 缺少固定插件 id，Figma 已禁用本地存储（探针报错：'
        + probe.clientErr + '）——令牌因此永远记不住。修复方法：在 Figma「新建插件」占位拿到 id 后填入 manifest 并重新导入。';
      hint.classList.remove('hidden');
    } else if (src && (src.client || src.doc)) {
      hint.textContent = '诊断：已读到上次保存的登录状态（'
        + [src.client ? '本地' : null, src.doc ? '文档内' : null].filter(Boolean).join(' + ')
        + '），但令牌校验未通过或已失效。';
      hint.classList.remove('hidden');
    } else if (lsHasToken) {
      hint.textContent = '诊断：浏览器本地缓存里有令牌，但插件主线程两路存储都没读到（可能插件 ID 已变化）。';
      hint.classList.remove('hidden');
    } else {
      hint.textContent = probe && probe.clientErr
        ? '诊断：本地存储写入异常（' + probe.clientErr + '），三路均无已保存的登录状态。'
        : '诊断：三路存储均无已保存的登录状态（首次使用，或上次保存失败）。';
      hint.classList.remove('hidden');
    }
    if (reason) {
      showError(reason);
      tokenInput.focus();
    }
    postToPlugin({ type: 'resize', width: 480, height: 420 });
  }

  function showMain() {
    clearError();
    $('gate').classList.add('hidden');
    $('main').classList.remove('hidden');
    $('foot').classList.remove('hidden');
    postToPlugin({ type: 'resize', width: 480, height: 720 });
  }

  // ---------- 画板（只读镜像 Figma 当前选中项） ----------
  function renderBoards() {

  function applyBoards(data) {

  }

  // ---------- 三级目标：团队 → 项目 → 编组 ----------
  function baseUrl() {

  function teamById(id) {

  function projectById(id) {
    for (var i = 0; i < state.projects.length; i++) {

  }
  function groupById(id) {
    for (var i = 0; i < state.groups.length; i++) {
      if (state.groups[i].id === id) return state.groups[i];

  function renderTargetSummary() {
    var team = teamById(state.teamId);
    var project = projectById(state.projectId);
    var groupLabel = '未分组';
    if (state.groupId === '__new__') groupLabel = state.newGroupName.trim() ? '新建：' + state.newGroupName.trim() : '新建编组';
    else if (state.groupId) {
      var g = groupById(state.groupId);

    }

  function renderTeams() {

    } else {
      sel.innerHTML = state.teams.map(function (t) {

          esc(t.name) + '（' + esc(t.project_count) + ' 个项目）</option>';
      }).join('');
    }
    var hint = $('teamHint');
    hint.classList.remove('err');
    if (state.scope === 'team') {
      hint.textContent = '此令牌只作用于当前团队；如需切换团队，请在网站生成「全部团队」范围的令牌。';
    } else {
      hint.textContent = '可以选择账号下任意团队。';

  function renderProjects() {
    var sel = $('project');
    if (state.projects.length) {
      sel.innerHTML = '<option value="">请选择项目…</option>' + state.projects.map(function (p) {
        return '<option value="' + esc(p.id) + '"' + (p.id === state.projectId ? ' selected' : '') + '>' +
          esc(p.name) + '（' + esc(p.frame_count) + ' 个画板）</option>';
      }).join('');
    } else {
      sel.innerHTML = '<option value="">（没有项目）</option>';
    }
  }

  function renderGroups() {
    var sel = $('group');
    var options = ['<option value="">未分组</option>'];
    state.groups.forEach(function (g) {
      options.push('<option value="' + esc(g.id) + '"' + (g.id === state.groupId ? ' selected' : '') + '>' +
        esc(g.name) + '（' + esc(g.frame_count) + ' 个画板）</option>');
    });
    options.push('<option value="__new__"' + (state.groupId === '__new__' ? ' selected' : '') + '>+ 新建编组…</option>');
    sel.innerHTML = options.join('');
    $('newGroupName').classList.toggle('hidden', state.groupId !== '__new__');
    if (state.groupId === '__new__') $('newGroupName').value = state.newGroupName;
  }

  function renderTargets() {
    renderTeams();
    renderProjects();
    renderGroups();
    renderTargetSummary();
  }

  function setHint(el, message, isError) {
    el.textContent = message || '';
    el.classList.toggle('err', !!isError);
  }

  /** fetch 失败时区分：服务器未启动 / 地址错误 vs 域名未在 manifest 授权 */
  function describeConnectionError(url) {
    var m = /^https?:\/\/([^/:?#]+)/i.exec(String(url || ''));
    if (!m) return '服务器地址不正确：请检查高级设置里的地址（需要以 http:// 或 https:// 开头）';
    var host = m[1].toLowerCase();
    if (host === 'localhost' || host === '127.0.0.1' || host === '0.0.0.0') {
      return '连不上服务器（HTTP 000 = 请求根本没发出去）：请到「高级设置 → 服务器」检查地址是否为后端实际端口（本地默认 http://localhost:4000），并确认后端已启动。当前地址：' + url;
    }
    return '无法访问 ' + url + '：该域名未在插件 manifest 中授权（networkAccess），请同步修改 manifest.json 后重新导入插件';
  }

  /** 网络打点：URL、请求体字节数、状态码/错误、耗时，成功失败都显示并打到插件控制台 */
  function recordNet(entry) {
    state.lastNet = entry;
    var line = '[net] ' + entry.method + ' ' + entry.url +
      ' | body=' + entry.bodyBytes + 'B | ' +
      (entry.error ? 'ERR ' + entry.error : 'HTTP ' + entry.status) +
      ' | ' + entry.ms + 'ms';
    state.lastNetLine = line;
    console.log(line);
    return line;
  }

  /** 上传超时/失败文案必须指向「请求」，不能再说「主线程无响应」 */
  async function api(path, options) {
    options = options || {};
    var headers = { Authorization: 'Bearer ' + state.token };
    if (options.body !== undefined) headers['Content-Type'] = 'application/json';
    var url = baseUrl() + path;
    var method = options.method || 'GET';
    var bodyText = options.body === undefined ? undefined : JSON.stringify(options.body);
    var bodyBytes = bodyText ? bodyText.length : 0;
    var res;
    // 请求级超时（单板上传 60 秒）：AbortController 只管请求，不看主线程是否静默
    var timeoutMs = Number(options.timeoutMs) || 0;
    var controller = timeoutMs && typeof AbortController === 'function' ? new AbortController() : null;
    var timer = controller ? setTimeout(function () { controller.abort(); }, timeoutMs) : null;
    var startedAt = Date.now();
    try {
      res = await fetch(url, {
        method: method,
        headers: headers,
        body: bodyText,
        signal: controller ? controller.signal : undefined,
      });
    } catch (err) {
      var ms = Date.now() - startedAt;
      if (controller && controller.signal.aborted) {
        var timeoutNet = recordNet({ method: method, url: url, bodyBytes: bodyBytes, ms: ms, error: 'timeout(' + Math.round(timeoutMs / 1000) + 's)' });
        var timeoutErr = new Error('上传请求超时（' + Math.round(timeoutMs / 1000) + 's），服务器无响应');
        timeoutErr.net = timeoutNet;
        throw timeoutErr;
      }
      var raw = (err && err.message) || String(err);
      var netLine = recordNet({ method: method, url: url, bodyBytes: bodyBytes, ms: ms, error: raw });
      var connErr = new Error(describeConnectionError(baseUrl()) + '（' + method + ' ' + path + '，' + ms + 'ms，' + raw + '）');
      connErr.net = netLine;
      throw connErr;
    } finally {
      if (timer) clearTimeout(timer);
    }
    var ms2 = Date.now() - startedAt;
    var data = null;
    try { data = await res.json(); } catch (err) { /* 非 JSON 响应 */ }
    recordNet({ method: method, url: url, bodyBytes: bodyBytes, ms: ms2, status: res.status });
    if (!res.ok) {
      var serverText = (data && data.error) ? String(data.error) : '(服务端未返回 error 文本)';
      var httpErr = new Error('服务器返回 HTTP ' + res.status + '：' + serverText);
      httpErr.status = res.status;
      httpErr.net = state.lastNet && state.lastNet;
      throw httpErr;
    }
    return data;
  }

  /** 校验令牌并拉取团队列表；401 回到粘贴令牌态 */
  async function connect() {
    clearError();
    var me = await api('/api/plugin/me');
    state.scope = me.scope === 'team' ? 'team' : 'all';
    state.teams = await api('/api/plugin/teams');
    if (!Array.isArray(state.teams)) state.teams = [];

    // 恢复上次团队；无效则退到令牌所属团队或第一个团队
    if (!state.teamId || !teamById(state.teamId)) {
      state.teamId = teamById(me.teamId) ? me.teamId : (state.teams[0] ? state.teams[0].id : '');
    }
    renderTargets();
    if (state.teamId) await loadProjects();
    persistPrefs();
  }

  async function loadProjects() {
    // 保留上次选中的项目/编组，拉回列表后再校验是否仍有效
    state.projects = [];
    state.groups = [];
    renderProjects();
    renderGroups();
    renderTargetSummary();
    setHint($('projectHint'), '');
    if (!state.teamId) {
      state.projectId = '';
      state.groupId = '';
      setHint($('projectHint'), '请先选择团队。');
      return;
    }
    try {
      state.projects = await api('/api/plugin/teams/' + encodeURIComponent(state.teamId) + '/projects');
      if (!Array.isArray(state.projects)) state.projects = [];
    } catch (err) {
      state.projects = [];
      state.projectId = '';
      state.groupId = '';
      if (err.status === 403) {
        setHint($('projectHint'), '令牌无权访问该团队（权限问题，不是没有数据）：请在网站「团队设置」生成作用范围为「全部团队」的令牌。', true);
      } else if (err.status === 404) {
        setHint($('projectHint'), '团队不存在或已被删除，请重新选择团队。', true);
      } else {
        throw err;
      }
      renderProjects();
      renderTargetSummary();
      persistPrefs();
      return;
    }

    if (state.projects.length === 0) {
      state.projectId = '';
      state.groupId = '';
      setHint($('projectHint'), '该团队还没有项目，请先在网站创建。');
    } else if (!state.projectId || !projectById(state.projectId)) {
      state.projectId = state.projects[0].id;
      state.groupId = '';
    }
    renderProjects();
    renderTargetSummary();
    if (state.projectId) await loadGroups();
    persistPrefs();
  }

  async function loadGroups() {
    state.groups = [];
    renderGroups();
    setHint($('groupHint'), '同一画板重复导入时会原位更新，不会产生重复画板。', false);
    if (!state.projectId) return;
    try {
      var data = await api('/api/plugin/projects/' + encodeURIComponent(state.projectId) + '/groups');
      state.groups = Array.isArray(data.groups) ? data.groups : [];
      if (state.groupId && state.groupId !== '__new__' && !groupById(state.groupId)) state.groupId = '';
      renderGroups();
      renderTargetSummary();
      persistPrefs();
    } catch (err) {
      state.groups = [];
      renderGroups();
      renderTargetSummary();
      if (err.status === 403) {
        setHint($('groupHint'), '令牌无权访问该项目的编组（权限问题）：请在网站生成「全部团队」范围的令牌。', true);
      } else if (err.status === 404) {
        setHint($('groupHint'), '项目不存在或已被删除，请重新选择项目。', true);
      } else {
        throw err;
      }
    }
  }

  // ---------- 偏好 ----------
  var prefsTimer = null;
  var LS_PREFS_KEY = 'designhub-plugin-prefs';
  /** v1.5.4 第三通道：UI iframe 的 localStorage。clientStorage 按插件 ID 隔离、
   * pluginData 存在文档内，localStorage 与两者独立，三通道互为兜底。失败静默（尽力而为）。 */
  function lsSavePrefs(prefs) {
    try { window.localStorage.setItem(LS_PREFS_KEY, JSON.stringify(prefs)); return true; }
    catch (e) { return false; }
  }
  function lsLoadPrefs() {
    try {
      var raw = window.localStorage.getItem(LS_PREFS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function persistPrefs(immediate) {
    clearTimeout(prefsTimer);
    var send = function () {
      var prefs = {
        version: 4,
        baseUrl: state.baseUrl,
        token: state.token,
        platform: state.platform,
        scale: state.scale,
        includeImage: state.includeImage,
        includeSlices: state.includeSlices,
        teamId: state.teamId,
        projectId: state.projectId,
        groupId: state.groupId,
        newGroupName: state.newGroupName,
      };
      postToPlugin({ type: 'save-prefs', prefs: prefs });
      lsSavePrefs(prefs);
    };
    if (immediate) { send(); return; }
    prefsTimer = setTimeout(send, 300);
  }

  function applyPrefs(prefs, src) {
    if (!prefs || typeof prefs !== 'object') return;
    if (typeof prefs.baseUrl === 'string' && prefs.baseUrl) {
      state.baseUrl = prefs.baseUrl;
      // 旧会话偏好里可能残留历史后端端口（5002 = 已下线的 preview-runtime16），
      // 现在后端固定跑 4000：一次性迁移，避免「上传失败 HTTP 000」每次都要手动改地址
      var stale = /^(https?:\/\/)(localhost|127\.0\.0\.1)(:\d+)?/i.exec(state.baseUrl);
      if (stale && stale[3] && stale[3] !== ':4000') {
        console.warn('[prefs] 旧服务地址 ' + state.baseUrl + ' 已迁移为 http://localhost:4000');
        state.baseUrl = 'http://localhost:4000';
        persistPrefs();
      }
    }
    if (typeof prefs.token === 'string') state.token = prefs.token;
    if (prefs.platform === 'ios' || prefs.platform === 'android' || prefs.platform === 'web') state.platform = prefs.platform;
    if ([1, 2, 3, 4].indexOf(Number(prefs.scale)) >= 0) state.scale = Number(prefs.scale);
    // v1.5.2：位图切图 / 逐图层高清切图固定开启，忽略旧偏好里保存的开关状态
    state.includeImage = true;
    state.includeSlices = true;
    if (typeof prefs.teamId === 'string') state.teamId = prefs.teamId;
    if (typeof prefs.projectId === 'string') state.projectId = prefs.projectId;
    if (typeof prefs.groupId === 'string') state.groupId = prefs.groupId;
    if (typeof prefs.newGroupName === 'string') state.newGroupName = prefs.newGroupName;
    // v1.5.4：记录偏好读取来源，门禁页据此显示「上次登录状态」存在哪
    if (src && typeof src === 'object') state.prefsSrc = { client: !!src.client, doc: !!src.doc };
    renderSettings();
    renderTargets();
  }

  /** boot 之后启动：没令牌先粘贴；有令牌则校验并恢复三级选择 */
  async function start() {
    if (state.started) return;
    state.started = true;
    if (!state.token || !/^imp_/.test(state.token)) {
      showGate();
      return;
    }
    showMain();
    renderSettings();
    renderTargets();
    try {
      await connect();
    } catch (err) {
      if (err && err.status === 401) {
        // 只有服务端明确返回 401（令牌无效/已撤销）才清空本地令牌
        state.token = '';
        state.teams = [];
        state.projects = [];
        state.groups = [];
        persistPrefs();
        showGate('令牌已失效或已撤销：' + err.message);
        postToPlugin({ type: 'notify', message: '导入令牌已失效，请重新粘贴' });
      } else {
        // 网络失败/超时/CORS/5xx：保留已存令牌，给重试
        showError('连接失败，令牌已保留：' + ((err && err.message) || String(err)), function () { retryConnect(); });
      }
    }
  }

  function retryConnect() {
    clearError();
    showMain();
    connect().catch(function (err) {
      if (err && err.status === 401) {
        state.token = '';
        persistPrefs();
        showGate('令牌已失效或已撤销：' + err.message);
      } else {
        showError('连接失败，令牌已保留：' + ((err && err.message) || String(err)), retryConnect);
      }
    });
  }

  // ---------- 上传 ----------
  function setProgress(current, total, stage) {
    total = total || 1;
    var pct = Math.max(0, Math.min(100, Math.round((current / total) * 100)));
    if (pct < state.progressPct) pct = state.progressPct;
    state.progressPct = pct;
    $('progressBox').classList.remove('hidden');
    $('progressTitle').textContent = '正在处理 ' + Math.min(current + 1, total) + ' / ' + total;
    $('progressCount').textContent = pct + '%';
    $('progressBar').style.width = pct + '%';
    if (stage) $('progressStage').textContent = stage;
  }

  function showProgressFail(message) {
    $('progressBox').classList.remove('hidden');
    $('progressFail').classList.remove('hidden');
    $('progressFailText').textContent = message;
    $('progressTitle').textContent = '上传失败';
  }

  function hideProgress() {
    $('progressBox').classList.add('hidden');
    $('progressFail').classList.add('hidden');
    $('progressFailText').textContent = '';
    $('progressBar').style.width = '0%';
    state.progressPct = 0;
  }

  function exportCacheKey(boardId) {
    return boardId + '|' + state.scale + '|' + (state.includeImage ? '1' : '0') + (state.includeSlices ? 's' : '');
  }

  async function startUpload(isRetry) {
    if (state.busy) return;
    var ids = state.boards.map(function (b) { return b.id; });
    if (!ids.length) { showError('请先在 Figma 里选中要导出的画板'); return; }
    if (!state.token) { showGate('请先粘贴导入令牌'); return; }
    if (!state.projectId) { showError('请先选择目标项目'); return; }
    if (state.groupId === '__new__' && !state.newGroupName.trim()) {
      showError('请填写新编组名称，或把编组改为「未分组」');
      return;
    }

    clearError();
    state.busy = true;
    state.progressPct = 0;
    // 黑匣子：上传期间每 10 秒 ping 一次主线程，回声用于判定卡死 vs 消息丢失
    state.lastPongAt = 0;
    state.lastProgressMsg = '';
    state.lastProgressAt = 0;
    state.chunkCount = 0;
    state.lastChunkAt = 0;
    if (state.pingTimer) clearInterval(state.pingTimer);
    state.pingTimer = setInterval(function () { postToPlugin({ type: 'ping', t: Date.now() }); }, 10000);
    // 只有全新一次上传才清空「已成功画板」；重试保留，跳过已入库的
    if (!isRetry) state.uploaded = {};
    updateUploadButton();
    $('successBox').classList.add('hidden');
    $('jsonBox').classList.add('hidden');
    $('progressFail').classList.add('hidden');
    $('progressBox').classList.remove('hidden');
    persistPrefs();

    var totals = { frames: 0, nodes: 0, slices: 0, warnings: [] };
    var total = ids.length;

    try {
      for (var i = 0; i < total; i++) {
        var key = exportCacheKey(ids[i]);
        var name = (state.boards[i] && state.boards[i].name) || ids[i];
        // 重试时跳过本次已经成功入库的画板
        var doneKey = ids[i] + '|' + state.projectId + '|' + (state.groupId || '') + '|' + state.newGroupName.trim();
        var prevDone = state.uploaded[doneKey];
        if (prevDone) {
          totals.frames += prevDone.frames;
          totals.nodes += prevDone.nodes;
          setProgress(i + 1, total, '已上传「' + name + '」，跳过');
          continue;
        }
        var exported = state.exportCache[key];

        if (exported) {
          // 重试：直接复用已序列化的结果，不再重新遍历节点
          setProgress(i, total, '复用已读取的「' + (exported.name || name) + '」，直接上传…');
        } else {
          setProgress(i, total, isRetry ? '重新读取节点（上次未完成）…' : '读取节点…');
          exported = await ask({
            type: 'export-board',
            boardId: ids[i],
            scale: state.scale,
            includeImage: state.includeImage,
            includeSlices: state.includeSlices,
            index: i,
            total: total,
          }, STAGE_TIMEOUT_MS.nodes);
          if (!exported || !exported.ok) {
            throw new Error((exported && exported.message) || ('画板 ' + ids[i] + ' 导出失败'));
          }
          if (!exported.payload) {
            throw new Error('画板数据未回传（payload 为空）：插件界面与主线程版本不一致，请完全退出 Figma 重新打开');
          }
          state.exportCache[key] = exported;
        }
        name = exported.name || name;
        if (exported.imageSkipped) totals.warnings.push('「' + name + '」' + exported.imageSkipped);
        if (Array.isArray(exported.sliceWarnings)) totals.warnings = totals.warnings.concat(exported.sliceWarnings);
        if (exported.sliceAssembleFails) totals.warnings.push('「' + name + '」有 ' + exported.sliceAssembleFails + ' 张逐图层切图分片回传不完整，已跳过');

        setProgress(i, total, '上传「' + name + '」…（POST /api/plugin/import）');
        var images = exported.image
          ? [{ nodeId: ids[i], dataUrl: 'data:image/png;base64,' + exported.image }]
          : [];
        var result = await api('/api/plugin/import', {
          method: 'POST',
          timeoutMs: STAGE_TIMEOUT_MS.upload,
          body: {
            platform: state.platform,
            scale: state.scale,
            projectId: state.projectId,
            groupId: state.groupId && state.groupId !== '__new__' ? state.groupId : undefined,
            newGroupName: state.groupId === '__new__' ? state.newGroupName.trim() : undefined,
            pluginVersion: state.boot.pluginVersion,
            exportedAt: exported.payload.exportedAt,
            file: exported.payload.file,
            boards: exported.payload.artboards,
            images: images,
          },
        });
        totals.frames += Number(result.frameCount || 0);
        totals.nodes += Number(result.nodeCount || 0);
        if (Array.isArray(result.warnings)) totals.warnings = totals.warnings.concat(result.warnings);
        if (result.groupId && state.groupId === '__new__') state.groupId = result.groupId;
        state.uploaded[doneKey] = { frames: Number(result.frameCount || 0), nodes: Number(result.nodeCount || 0) };

        // 逐图层高清切图：画板入库后按批上传（服务端单批上限 120，这里按 100 分批）。
        // 失败只记告警、不让画板导入整体失败——重试会重新走一遍（/slices 原位替换，幂等）。
        var sliceList = Array.isArray(exported.slicesData) ? exported.slicesData : [];
        if (sliceList.length) {
          try {
            for (var sb = 0; sb < sliceList.length; sb += 100) {
              var batch = sliceList.slice(sb, sb + 100);
              setProgress(i, total, '上传「' + name + '」逐图层切图…（' + (sb + 1) + '-' +
                (sb + batch.length) + '/' + sliceList.length + '）');
              var sres = await api('/api/plugin/slices', {
                method: 'POST',
                timeoutMs: STAGE_TIMEOUT_MS.upload,
                body: { projectId: state.projectId, slices: batch },
              });
              totals.slices += Number(sres && sres.saved || 0);
              if (Array.isArray(sres && sres.warnings)) totals.warnings = totals.warnings.concat(sres.warnings);
            }
          } catch (sliceErr) {
            totals.warnings.push('「' + name + '」逐图层切图上传失败：' +
              ((sliceErr && sliceErr.message) || String(sliceErr)) + '（画板已入库，可重试补传）');
          }
        }

        setProgress(i + 1, total, '已导入「' + name + '」' + (sliceList.length ? '（含 ' + sliceList.length + ' 张逐图层切图）' : ''));
      }

      state.exportCache = {};
      await loadGroups();
      hideProgress();
      $('successBox').classList.remove('hidden');
      $('successFrames').textContent = totals.frames;
      $('successNodes').textContent = totals.nodes;
      var warn = $('successWarn');
      if (totals.warnings.length) {
        warn.textContent = totals.warnings.join('\n');
        warn.classList.remove('hidden');
      } else {
        warn.classList.add('hidden');
      }
      var url = baseUrl() + '/projects/' + state.projectId;
      $('openSite').href = url;
      $('successUrl').textContent = url;
      $('netInfo').textContent = state.lastNetLine || '';
      postToPlugin({ type: 'notify', message: '已导入 ' + totals.frames + ' 个画板 / ' + totals.nodes + ' 个节点' +
        (totals.slices ? ' / ' + totals.slices + ' 张高清切图' : '') });
    } catch (err) {
      var failMsg = err && err.message ? err.message : String(err);
      var netLine = (err && err.net) || state.lastNetLine || '';
      var failHint = '\n重试会跳过本次已上传的画板，并复用已读取的画板数据。';
      showProgressFail(failMsg + failHint + (netLine ? '\n诊断：' + netLine : ''));
      postToPlugin({ type: 'notify', message: '上传失败：' + failMsg });
    } finally {
      if (state.pingTimer) { clearInterval(state.pingTimer); state.pingTimer = null; }
      state.busy = false;
      updateUploadButton();
    }
  }

  // ---------- 仅导出 JSON ----------
  var lastJson = '';
  async function exportJsonOnly() {
    var ids = state.boards.map(function (b) { return b.id; });
    if (!ids.length) { showError('请先在 Figma 里选中要导出的画板'); return; }
    clearError();
    $('jsonOnly').disabled = true;
    $('jsonOnly').textContent = '正在导出…';
    try {
      var result = await ask({ type: 'export-json', boardIds: ids, total: ids.length });
      if (!result || !result.ok) throw new Error((result && result.message) || '导出失败');
      lastJson = JSON.stringify(result.payload, null, 2);
      $('jsonText').textContent = lastJson;
      $('jsonBox').classList.remove('hidden');
    } catch (err) {
      showError(err && err.message ? err.message : String(err));
    } finally {
      $('jsonOnly').disabled = false;
      $('jsonOnly').textContent = '仅导出 JSON';
    }
  }

  async function copyJson() {
    try {
      await navigator.clipboard.writeText(lastJson);
      postToPlugin({ type: 'notify', message: 'JSON 已复制到剪贴板' });
    } catch (err) {
      showError('复制失败：请手动全选文本框内容复制');
    }
  }

  function downloadJson() {
    var blob = new Blob([lastJson], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'designhub-export.json';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  // ---------- 事件绑定 ----------
  $('close').onclick = function () { postToPlugin({ type: 'close' }); };
  $('errorRetry').onclick = function () {
    var fn = retryHandler;
    clearError();
    if (fn) fn();
  };

  // 首次粘贴令牌
  $('gateServerEdit').onclick = function () {
    $('gateServerRow').classList.toggle('hidden');
  };
  $('gateBaseUrl').oninput = function () {
    state.baseUrl = $('gateBaseUrl').value.trim();
    $('gateServerText').textContent = baseUrl();
  };
  async function saveGateToken() {
    var token = $('gateToken').value.trim();
    if (!token) { showError('请粘贴导入令牌'); return; }
    if (!/^imp_/.test(token)) { showError('令牌格式不正确：应以 imp_ 开头'); return; }
    state.token = token;
    state.teams = [];
    state.projects = [];
    state.groups = [];
    state.teamId = '';
    state.projectId = '';
    state.groupId = '';
    clearError();
    persistPrefs(true);
    showMain();
    renderSettings();
    try {
      await connect();
      $('meta').textContent = '已连接 ' + baseUrl();
    } catch (err) {
      if (err && err.status === 401) {
        state.token = '';
        persistPrefs();
        showGate('令牌无效或已撤销：' + err.message);
      } else {
        showError(((err && err.message) || String(err)), retryConnect);
      }
    }
  }
  $('gateSave').onclick = function () { saveGateToken(); };
  $('gateToken').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') saveGateToken();
  });

  // 目标条展开 / 收起
  $('targetEdit').onclick = function () {
    state.targetOpen = !state.targetOpen;
    $('targetEditor').classList.toggle('hidden', !state.targetOpen);
    renderTargetSummary();
  };

  // 三级联动：切换团队清空项目与编组，切换项目清空编组
  $('team').onchange = function () {
    if (state.busy) return;
    state.teamId = $('team').value;
    state.projectId = '';
    state.groupId = '';
    state.newGroupName = '';
    clearError();
    renderTargets();
    persistPrefs();
    loadProjects().catch(function (err) {
      showError((err && err.message) || String(err), function () { loadProjects().catch(function () {}); });
    });
  };
  $('project').onchange = function () {
    if (state.busy) return;
    state.projectId = $('project').value;
    state.groupId = '';
    state.newGroupName = '';
    clearError();
    renderGroups();
    renderTargetSummary();
    persistPrefs();
    loadGroups().catch(function (err) {
      showError((err && err.message) || String(err), function () { loadGroups().catch(function () {}); });
    });
  };
  $('group').onchange = function () {
    state.groupId = $('group').value;
    $('newGroupName').classList.toggle('hidden', state.groupId !== '__new__');
    if (state.groupId === '__new__') { state.newGroupName = $('newGroupName').value; $('newGroupName').focus(); }
    renderTargetSummary();
    persistPrefs();
    clearError();
  };
  $('newGroupName').oninput = function () {
    state.newGroupName = $('newGroupName').value;
    renderTargetSummary();
    persistPrefs();
  };

  // 高级设置
  $('baseUrl').oninput = function () {
    state.baseUrl = $('baseUrl').value.trim();
    persistPrefs();
  };
  $('reconnect').onclick = function () { retryConnect(); };
  $('token').oninput = function () { state.token = $('token').value.trim(); persistPrefs(); };
  $('saveToken').onclick = function () {
    var token = $('token').value.trim();
    if (!/^imp_/.test(token)) { showError('令牌格式不正确：应以 imp_ 开头'); return; }
    state.token = token;
    state.teamId = '';
    state.projectId = '';
    state.groupId = '';
    persistPrefs();
    retryConnect();
  };
  document.querySelectorAll('#platformGroup button').forEach(function (b) {
    b.onclick = function () { pickPlatform(b.dataset.platform); };
  });
  document.querySelectorAll('#scaleGroup label').forEach(function (l) {
    l.onclick = function () {
      state.scale = Number(l.dataset.scale);
      renderSettings();
      persistPrefs();
    };
  });

  // v1.5.2：位图切图 / 逐图层高清切图已固定开启，开关元素与事件一并移除

  // 画板列表是 Figma 选中项的只读镜像，没有勾选交互

  $('upload').onclick = function () { startUpload(); };
  $('progressRetry').onclick = function () {
    $('progressFail').classList.add('hidden');
    $('progressFailText').textContent = '';
    startUpload(true);
  };
  $('jsonOnly').onclick = function () { exportJsonOnly(); };
  $('copyJson').onclick = function () { copyJson(); };
  $('downloadJson').onclick = downloadJson;

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') postToPlugin({ type: 'close' });
  });

  window.onerror = function (message) { showError('插件界面异常：' + message); };
  window.onunhandledrejection = function (e) {
    showError('操作失败：' + ((e.reason && e.reason.message) || e.reason));
  };

  // ---------- 主线程消息 ----------
  window.onmessage = function (event) {
    var msg = event.data && event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'boot') {
      state.boot = msg;
      $('meta').textContent = 'v' + msg.pluginVersion + ' · ' + msg.buildDate + ' · ' + (msg.fileName || '') + ' / ' + (msg.pageName || '');
      // Figma 会缓存旧 ui.html：界面版本与主线程不一致时，必须提示重启 Figma，否则跑的是旧逻辑
      if (msg.pluginVersion && msg.pluginVersion !== UI_VERSION) {
        console.warn('[version] UI=' + UI_VERSION + ' main=' + msg.pluginVersion);
        postToPlugin({
          type: 'notify',
          message: '插件界面是旧缓存（UI ' + UI_VERSION + ' / 主线程 ' + msg.pluginVersion + '）：请完全退出 Figma 再打开，或删除该开发插件后重新 Import manifest',
        });
      }
      return;
    }
    if (msg.type === 'prefs') {
      var prefs = msg.prefs || {};
      // v1.5.4 第三通道兜底：主线程两路都没读到令牌时，再试 UI iframe 的 localStorage
      if ((!prefs.token || !/^imp_/.test(prefs.token)) && !state.token) {
        var lsPrefs = lsLoadPrefs();
        if (lsPrefs && typeof lsPrefs.token === 'string' && /^imp_/.test(lsPrefs.token)) {
          prefs = Object.assign({}, prefs, lsPrefs);
          msg.src = msg.src || {};
          msg.src.localStorage = true;
        }
      }
      applyPrefs(prefs, msg.src);
      if (msg.probe) state.prefsProbe = msg.probe;
      if (msg.src && msg.src.localStorage) persistPrefs(true); // 自愈：回写主线程两路存储
      start();
      return;
    }
    if (msg.type === 'prefs-saved') {
      // v1.5.4：保存结果可视化——写进哪路存储、哪路失败，一目了然
      var r = msg.result || {};
      if (r.client && r.doc) {
        postToPlugin({ type: 'notify', message: '登录状态已保存（本地 + 文档内）' });
      } else if (r.doc) {
        postToPlugin({ type: 'notify', message: '登录状态已保存到文档内（本地存储不可用：' + (r.clientErr || '未知原因') + '）' });
      } else if (r.client) {
        postToPlugin({ type: 'notify', message: '登录状态已保存到本地（文档内写入失败：' + (r.docErr || '未知原因') + '）' });
      } else {
        postToPlugin({ type: 'notify', message: '警告：登录状态保存失败（' + (r.clientErr || r.docErr || '两路存储均不可用') + '），下次打开需要重新粘贴令牌' });
      }
      return;
    }
    if (msg.type === 'boards') { applyBoards(msg); return; }
    if (msg.type === 'progress') {
      // 心跳：收到任何 progress 都重置「无响应」计时（按消息里的阶段上限）
      if (msg.requestId) heartbeat(msg.requestId, msg.silenceMs);
      if (msg.message) {
        $('progressStage').textContent = msg.message;
        state.lastProgressMsg = msg.message;
        state.lastProgressAt = Date.now();
      }
      if (typeof msg.done === 'number' && typeof msg.total === 'number' && msg.total > 0) {
        var pct = Math.max(0, Math.min(100, Math.round((msg.done / msg.total) * 100)));
        if (pct > state.progressPct) {
          state.progressPct = pct;
          $('progressCount').textContent = pct + '%';
          $('progressBar').style.width = pct + '%';
        }
      }
      return;
    }
    if (msg.type === 'pong') {
      // 主线程回声：能收到 pong 说明消息链路通、主线程没死死阻塞
      state.lastPongAt = Date.now();
      state.mainBusy = !!msg.busy;
      state.lastPongVersion = msg.pluginVersion || state.lastPongVersion;
      state.lastPongGen = typeof msg.gen === 'number' ? msg.gen : state.lastPongGen;
      return;
    }
    if (msg.type === 'image-chunk') {
      // 分片 base64：拼装期间同样算心跳，避免误判无响应。
      // v1.3.9：切片分片的 requestId 是 ask 请求 id（可用于心跳），bufferKey 才是拼装键
      if (msg.requestId) heartbeat(msg.requestId, STAGE_TIMEOUT_MS.images);
      state.chunkCount++;
      state.lastChunkAt = Date.now();
      var chunkKey = msg.bufferKey || msg.requestId;
      var buf = imageChunkBufs.get(chunkKey);
      if (!buf) {
        buf = { total: msg.total, parts: [], received: 0 };
        imageChunkBufs.set(chunkKey, buf);
      }
      buf.total = msg.total;
      buf.parts[msg.seq] = msg.data;
      buf.received++;
      return;
    }
    if (msg.type === 'board-exported') {
      // v1.5.0：画板 JSON 分片拼装（失败直接以 ok:false 结束请求，给出明确原因）
      try {
        assemblePayloadChunks(msg);
      } catch (perr) {
        settle(msg.requestId, { ok: false, message: perr.message });
        return;
      }
      if (msg.imageChunks) {
        var chunkBuf = imageChunkBufs.get(msg.requestId);
        imageChunkBufs.delete(msg.requestId);
        if (!chunkBuf || chunkBuf.received < chunkBuf.total) {
          settle(msg.requestId, {
            ok: false,
            message: '切图分片回传不完整（' + (chunkBuf ? chunkBuf.received : 0) + '/' +
              (chunkBuf ? chunkBuf.total : msg.imageChunks) + '），请重试',
          });
          return;
        }
        msg.image = chunkBuf.parts.join('');
      }
      // 逐图层高清切图：按 key 拼装各切片分片，转成 /api/plugin/slices 需要的 dataUrl 格式
      if (Array.isArray(msg.slices) && msg.slices.length) {
        var sliceFails = 0;
        msg.slicesData = [];
        for (var si = 0; si < msg.slices.length; si++) {
          var meta = msg.slices[si];
          var sbuf = imageChunkBufs.get(meta.key);
          imageChunkBufs.delete(meta.key);
          if (!sbuf || sbuf.received < sbuf.total) { sliceFails++; continue; }
          var mime = meta.format === 'SVG' ? 'image/svg+xml' : 'image/png';
          msg.slicesData.push({
            nodeId: meta.nodeId,
            name: meta.name,
            format: meta.format,
            scale: meta.scale,
            dataUrl: 'data:' + mime + ';base64,' + sbuf.parts.join(''),
          });
        }
        if (sliceFails) msg.sliceAssembleFails = sliceFails;
      }
      if (msg.timings) console.log('[timing]', msg.name, msg.timings);
      settle(msg.requestId, msg);
      return;
    }
    if (msg.type === 'json-result') {
      // v1.5.0：payload 分片拼装，与 import 路径同一套保护
      try {
        assemblePayloadChunks(msg);
        settle(msg.requestId, msg);
      } catch (perr) {
        settle(msg.requestId, { ok: false, message: perr.message });
      }
      return;
    }
    if (msg.type === 'error') {
      // 主线程已回传真实异常：按 requestId 结束对应请求，界面显示原因而不是「无响应」
      var errText = msg.message || '主线程操作失败';
      if (msg.requestId) {
        var p = pending.get(msg.requestId);
        if (p) {
          clearTimeout(p.timer);
          pending.delete(msg.requestId);
          imageChunkBufs.delete(msg.requestId);
          p.reject(new Error(errText));
        }
      } else {
        rejectAll(errText);
      }
      showError(errText);
      return;
    }
  };

  renderSettings();
  renderTargets();
  postToPlugin({ type: 'ready' });
})();
</script>
</body>
</html>
