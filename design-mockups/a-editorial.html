<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方案 A · 排印主义 Editorial</title>
<style>
  :root{
    --ink:#111110; --ink-2:#6f6e69; --line:#e6e4df; --bg:#ffffff;
    --paper:#f6f5f2; --accent:#ff4d00; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Inter","Helvetica Neue",-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  }
  ::selection{background:var(--ink);color:#fff}
  a{color:inherit;text-decoration:none}

  /* ── 顶栏：一根细线下的极简工具条 ───────────────── */
  .top{
    display:flex;align-items:center;gap:28px;
    padding:0 40px;height:64px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);z-index:10;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:15px}
  .brand i{width:14px;height:14px;background:var(--ink);display:inline-block}
  .brand i:hover{background:var(--accent)}
  .nav{display:flex;gap:22px;font-size:13px;color:var(--ink-2)}
  .nav a{padding:4px 0}
  .nav a.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
  .nav a:hover{color:var(--ink)}
  .top .right{margin-left:auto;display:flex;align-items:center;gap:18px}
  .issue{font-family:var(--mono);font-size:11px;color:var(--ink-2);letter-spacing:.08em}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer}
  .avatar:hover{background:var(--accent)}

  /* ── 刊头：超大标题 + 编号 ─────────────────────── */
  .masthead{padding:72px 40px 48px;border-bottom:1px solid var(--line)}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--accent);margin-bottom:20px}
  .mast{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
  h1{font-size:88px;line-height:.95;letter-spacing:-.045em;font-weight:800}
  h1 small{display:block;margin-top:18px;font-size:15px;font-weight:400;letter-spacing:0;color:var(--ink-2)}
  .new{
    flex:none;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 22px;
    background:var(--ink);color:#fff;font-size:14px;font-weight:600;letter-spacing:.02em;
    transition:background .15s;
  }
  .new:hover{background:var(--accent)}
  .new sup{font-family:var(--mono);font-weight:400;font-size:11px;opacity:.7}

  /* ── 项目：行式索引，不是卡片网格 ─────────────── */
  .list{padding:0 40px}
  .row{
    display:grid;grid-template-columns:120px 1fr auto 60px;gap:32px;align-items:center;
    padding:26px 0;border-bottom:1px solid var(--line);transition:background .12s;cursor:pointer;
  }
  .row:hover{background:var(--paper)}
  .row:hover .go{color:var(--accent);transform:translateX(4px)}
  .thumb{width:120px;height:84px;background:var(--paper);border:1px solid var(--line);
    display:flex;align-items:flex-end;justify-content:flex-start;gap:5px;padding:8px;overflow:hidden}
  .thumb .f{width:18px;height:100%;background:#fff;border:1px solid #d8d6d0;border-bottom:none}
  .thumb .f:nth-child(2){height:78%}
  .thumb .f:nth-child(3){height:88%;background:#111}
  .thumb .f:nth-child(4){height:70%;background:#ff4d00;border-color:#ff4d00}
  .name{min-width:0}
  .name b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
  .name span{display:block;margin-top:8px;font-size:13px;color:var(--ink-2)}
  .meta{font-family:var(--mono);font-size:11px;color:var(--ink-2);letter-spacing:.06em;text-align:right;line-height:1.9}
  .meta em{font-style:normal;color:var(--ink)}
  .go{font-size:22px;color:var(--ink-2);transition:all .15s;justify-self:end}

  /* ── 页脚 ─────────────────────────────────────── */
  footer{padding:56px 40px 72px;display:flex;justify-content:space-between;align-items:flex-end}
  footer .big{font-size:15px;font-weight:600;letter-spacing:-.01em}
  footer .mono{font-family:var(--mono);font-size:11px;color:var(--ink-2);letter-spacing:.08em}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><i></i>设计协作</div>
  <nav class="nav"><a class="on" href="#">项目</a><a href="#">团队成员</a></nav>
  <div class="right">
    <span class="issue">演示团队 · NO.002</span>
    <span class="avatar">D</span>
  </div>
</header>

<section class="masthead">
  <p class="kicker">INDEX / 全部项目 — 2026</p>
  <div class="mast">
    <h1>项目<small>选择项目进入，查看设计稿、标注与规范。</small></h1>
    <button class="new">新建项目 <sup>03</sup></button>
  </div>
</section>

<main class="list">
  <a class="row" href="#">
    <span class="thumb"><span class="f"></span><span class="f"></span><span class="f"></span><span class="f"></span></span>
    <span class="name"><b>演示项目</b><span>首页 / 登录 / 我的 — 三张种子画板，用于体验完整流程</span></span>
    <span class="meta">2 FRAMES<br><em>今天 14:44</em></span>
    <span class="go">→</span>
  </a>
  <a class="row" href="#">
    <span class="thumb"><span class="f"></span><span class="f"></span><span class="f"></span><span class="f"></span></span>
    <span class="name"><b>品牌官网改版</b><span>官网首页、产品页与博客模板的高保真稿</span></span>
    <span class="meta">6 FRAMES<br><em>昨天 18:02</em></span>
    <span class="go">→</span>
  </a>
  <a class="row" href="#">
    <span class="thumb"><span class="f"></span><span class="f"></span><span class="f"></span><span class="f"></span></span>
    <span class="name"><b>移动端 App 2.0</b><span>全新信息架构下的核心链路：浏览 / 下单 / 我的</span></span>
    <span class="meta">12 FRAMES<br><em>11-07</em></span>
    <span class="go">→</span>
  </a>
</main>

<footer>
  <div>
    <p class="big">设计协作 Design Handoff</p>
    <p class="mono" style="margin-top:8px">设计稿 · 标注 · 规范，一站式交付</p>
  </div>
  <p class="mono">⌘K 快速搜索 / ← 返回</p>
</footer>

</body>
</html>
