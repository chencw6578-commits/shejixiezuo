<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>现有 UI 精修 · V3 线框精密</title>
<style>
  /* ============ V3 线框精密 ============
     思路：向专业工具的「精密感」收敛——
     · 全局 hairline 描边体系：卡片 1px 边框、8px 圆角、无阴影
     · 品牌紫降级为「指示器」：仅选中线/焦点/hover 出现
     · 新建按钮改墨色，弱化彩色 CTA
     · 信息密度略升：元数据等宽数字，卡片 hover 描边加深 + 微上浮 */
  :root{
    --brand:#6c4cf1; --brand-soft:#f3f0ff;
    --bg:#fbfbfc; --panel:#ffffff; --hover:#f4f4f6;
    --line:#e6e7ea; --line-strong:#d6d8dd;
    --text:#16171a; --dim:#7d8087;
    --r:8px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;font-size:14px}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

  .topbar{display:flex;align-items:center;height:44px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  .team-switch{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:6px;font-size:13px;font-weight:600}
  .team-switch:hover{background:var(--hover)}
  .team-switch svg{color:var(--dim)}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .topbar .count{font-family:var(--mono);font-size:10.5px;color:#aeb1b8;letter-spacing:.06em}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--hover);border:1px solid var(--line-strong);color:var(--dim);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}

  .body{display:flex;height:calc(100vh - 44px)}
  .sidebar{width:192px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:10px 8px}
  .nav{display:flex;flex-direction:column;gap:1px}
  .nav-item{position:relative;display:flex;align-items:center;gap:8px;height:30px;padding:0 9px;
    border-radius:6px;color:var(--dim);font-size:13px}
  .nav-item:hover{background:var(--hover);color:var(--text)}
  .nav-item.active{background:var(--hover);color:var(--text);font-weight:600}
  .nav-item.active::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:2px;border-radius:1px;background:var(--brand)}
  .nav-item svg{color:currentColor;opacity:.8}
  .side-foot{margin-top:26px;padding:10px 9px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:10px;color:#b6b9c0;letter-spacing:.05em;line-height:1.9}

  .main{flex:1;overflow:auto}
  .inner{max-width:1400px;margin:0 auto;padding:36px 36px 60px}
  .view-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
  .view-header h1{font-size:17px;font-weight:650;letter-spacing:-.01em}
  .view-header h1 .sep{color:#c9cbd1;font-weight:400;margin:0 2px}
  .view-header p{margin-top:6px;font-size:12.5px;color:var(--dim)}
  .new-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;
    background:var(--text);color:#fff;border-radius:var(--r);font-size:12.5px;font-weight:600}
  .new-btn:hover{background:#000}

  .grid{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .card{position:relative;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);overflow:hidden;
    transition:border-color .12s ease,transform .12s ease,box-shadow .12s ease}
  .card:hover{border-color:var(--line-strong);transform:translateY(-1px);box-shadow:0 4px 14px -8px rgba(22,23,26,.14)}
  .cover{height:150px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px;background:var(--hover);
    border-bottom:1px solid var(--line)}
  .cover .tile{border-radius:3px;background:#fff;box-shadow:0 0 0 1px rgba(22,23,26,.06);overflow:hidden;
    display:flex;flex-direction:column;padding:6px 5px;gap:3px}
  .cover .tile i{display:block;height:3px;border-radius:1.5px;background:#e4e5e8}
  .cover .tile i:first-child{width:55%;height:4px;background:#c8cad0}
  .cover .tile.dark{background:#1e1f24}
  .cover .tile.dark i{background:#35373e}
  .cover .tile.dark i:first-child{background:#4d5058}
  .cover .tile.tint-blue{background:#e8effa}
  .cover .tile.tint-green{background:#e7f0e6}
  .cover .tile.spacer{visibility:hidden}
  .card-body{padding:11px 13px 12px;display:flex;flex-direction:column;gap:4px}
  .name{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
  .name svg{color:#a2a5ac}
  .meta{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.02em;font-variant-numeric:tabular-nums;padding-right:28px}
  .meta em{font-style:normal;color:var(--text)}
  .menu{position:absolute;right:6px;bottom:8px;width:26px;height:26px;border-radius:6px;color:#b0b3ba;
    display:flex;align-items:center;justify-content:center;opacity:.5;transition:opacity .12s,background .12s}
  .card:hover .menu{opacity:1}
  .menu:hover{background:var(--hover)}
</style>
</head>
<body>

<header class="topbar">
  <button class="team-switch">演示团队
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div class="right">
    <span class="count">3 PROJECTS</span>
    <span class="avatar">D</span>

<div class="body">
  <aside class="sidebar">
    <nav class="nav">
      <a class="nav-item active" href="#">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        项目</a>
      <a class="nav-item" href="#">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.6c2.3.1 4 1.5 4.5 4"/></svg>
        团队成员</a>
    </nav>
    <div class="side-foot">TEAM · DEMO<br>STORAGE · LOCAL</div>
  </aside>

  <main class="main">
    <div class="inner">
      <header class="view-header">
        <div>
          <h1>项目 <span class="sep">·</span> 演示团队</h1>

        </div>
        <button class="new-btn">

          新建项目</button>
      </header>

      <ul class="grid">
        <li><button class="card">
          <span class="cover">
            <span class="tile"><i></i><i></i><i></i><i></i></span>
            <span class="tile dark"><i></i><i></i><i></i></span>
            <span class="tile"><i></i><i></i><i></i><i></i></span>
            <span class="tile tint-blue"><i></i><i></i><i></i></span>
            <span class="tile"><i></i><i></i><i></i><i></i></span>
            <span class="tile spacer"></span>
          </span>
          <span class="card-body">
            <span class="name"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>演示项目</span>
            <span class="meta">2 FRAMES · <em>2026/11/10 14:44</em></span>
          </span>
          <span class="menu">⋯</span>
        </button></li>

        <li><button class="card">
          <span class="cover">
            <span class="tile tint-blue"><i></i><i></i><i></i><i></i></span>
            <span class="tile"><i></i><i></i><i></i></span>
            <span class="tile dark"><i></i><i></i><i></i></span>
            <span class="tile"><i></i><i></i><i></i><i></i></span>
            <span class="tile tint-blue"><i></i><i></i><i></i></span>
            <span class="tile spacer"></span>
          </span>
          <span class="card-body">
            <span class="name"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>品牌官网改版</span>
            <span class="meta">6 FRAMES · <em>2026/11/09 18:02</em></span>
          </span>
          <span class="menu">⋯</span>
        </button></li>

        <li><button class="card">
          <span class="cover">
            <span class="tile tint-green"><i></i><i></i><i></i><i></i></span>
            <span class="tile"><i></i><i></i><i></i></span>
            <span class="tile tint-green"><i></i><i></i><i></i></span>
            <span class="tile dark"><i></i><i></i><i></i></span>
            <span class="tile spacer"></span>
            <span class="tile spacer"></span>
          </span>
          <span class="card-body">
            <span class="name"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>移动端 App 2.0</span>
            <span class="meta">12 FRAMES · <em>2026/11/07 10:26</em></span>
          </span>
          <span class="menu">⋯</span>
        </button></li>
      </ul>
    </div>
  </main>
</div>

</body>
</html>
