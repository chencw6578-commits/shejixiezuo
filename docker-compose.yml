services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: designhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/designhub &&
      mc anonymous set download local/designhub &&
      exit 0"

  server:
    build: ./server
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PORT: '4000'
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/designhub
      FIGMA_TOKEN: ${FIGMA_TOKEN}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: designhub
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PUBLIC_BASE_URL: ''   # 留空则使用预签名 URL
      IMPORT_CONCURRENCY: '2'
    volumes:
      - server-storage:/app/storage
    ports:
      - '4000:4000'

  web:
    build: ./web
    depends_on:
      - server
    ports:
      - '8080:80'

volumes:
  pgdata:
  miniodata:
  server-storage:
